<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Online Store</title>
    <style>
        :root {
            --primary: #2563eb;
            --accent: #f59e0b;
            --background: #f5f5f5;
            --text: #222;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        /* Header & Navigation */
        header {
            background: var(--primary);
            color: white;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: var(--accent);
        }

        .badge {
            background-color: var(--accent);
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 4px;
        }

        /* Sections Layout */
        section {
            padding: 40px 8%;
        }

        h2 {
            text-align: center;
            color: var(--primary);
        }

        /* Hero Banner */
        .hero {
            text-align: center;
            background: #dbeafe;
            padding: 70px 20px;
        }

        /* Products Grid */
        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .image {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .card p {
            color: var(--primary);
            font-weight: bold;
        }

        /* Buttons */
        button {
            background: var(--accent);
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #d97706;
            color: white;
        }

        .remove {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
        }

        .remove:hover {
            background: #dc2626;
        }

        /* Cart Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        /* Form & Inline Error Styling */
        form {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        form input[type="text"],
        form input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        form input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            display: block;
            margin-bottom: 10px;
            text-align: left;
            min-height: 16px;
        }

        .confirmation-box {
            display: none;
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 6px;
            margin: 0 auto 15px auto;
            max-width: 500px;
            text-align: center;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 850px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            nav {
                flex-direction: column;
                text-align: center;
            }
            .products {
                grid-template-columns: 1fr;
            }
            table {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>ShopEase</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart 🛒 <span id="cartCountBadge" class="badge">0</span></a>
            <a href="#checkout">Checkout</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <h2>Welcome to ShopEase</h2>
        <p>Your one-stop online shopping store</p>
    </section>

    <!-- Task 2: Dynamic product rendering targets this container -->
    <section id="products">
        <h2>Products</h2>
        <div class="products" id="productsContainer"></div>
    </section>

    <!-- Task 4 & 5: Dynamic Cart rendering -->
    <section id="cart">
        <h2>Shopping Cart 🛒</h2>
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cartItems"></tbody>
            <tfoot>
                <tr>
                    <th colspan="3">Grand Total</th>
                    <th colspan="2" id="grandTotal">₹0</th>
                </tr>
            </tfoot>
        </table>
    </section>

    <!-- Task 6 & 7: Form Validation & Order Confirmation -->
    <section id="checkout">
        <h2>Checkout</h2>
        <div id="orderConfirmation" class="confirmation-box"></div>
        <form id="checkoutForm" novalidate>
            <input type="text" id="custName" placeholder="Name">
            <span class="error-msg" id="nameError"></span>

            <input type="text" id="custAddress" placeholder="Address">
            <span class="error-msg" id="addressError"></span>

            <input type="text" id="custCity" placeholder="City">
            <span class="error-msg" id="cityError"></span>

            <input type="text" id="custPincode" placeholder="Pincode (6 digits)">
            <span class="error-msg" id="pincodeError"></span>

            <input type="tel" id="custPhone" placeholder="Phone (10 digits)">
            <span class="error-msg" id="phoneError"></span>

            <p><b>Payment Method</b></p>
            <label><input type="radio" name="payment" checked> Cash on Delivery</label>
            <label><input type="radio" name="payment"> UPI</label>
            <label><input type="radio" name="payment"> Card</label>
            <br><br>
            <button type="submit">Place Order</button>
        </form>
    </section>

    <footer>
        <p>Contact: support@shopease.com | +91 98765 43210</p>
        <p>© 2026 ShopEase</p>
    </footer>

    <!-- Connected to labsheet-02.js -->
    <script src="labsheet-02.js"></script>
</body>
</html>
